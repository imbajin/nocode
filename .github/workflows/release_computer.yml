name: Release Computer(HG)

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Source repository
        required: true
        default: 'apache/hugegraph-computer'
      repository_branch:
        description: Source branch, tag or commit
        required: true
        default: 'release-1.8.0'
      release_version:
        description: Release version
        required: true
        default: '1.8.0'
      java_version:
        description: Java version
        required: true
        type: choice
        default: '17'
        options: ['11', '17']
      deploy_maven:
        description: Upload to Maven staging
        required: true
        type: boolean
        default: true
      make_staging_public:
        description: Enable public downloads
        required: true
        type: boolean
        default: false
      deploy_svn:
        description: Upload candidates to SVN
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-computer-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: source/computer
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      COMPONENT: computer
    steps:
      - name: Check close option
        working-directory: ${{ github.workspace }}
        env:
          DEPLOY_MAVEN: ${{ inputs.deploy_maven }}
          CLOSE_STAGING: ${{ inputs.make_staging_public }}
        run: |
          if [[ $CLOSE_STAGING == true && $DEPLOY_MAVEN != true ]]; then
            echo 'Close staging requires Maven upload'; exit 1
          fi

      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository_url }}
          ref: ${{ inputs.repository_branch }}
          path: source
          persist-credentials: false

      - name: Install SVN client
        if: ${{ inputs.deploy_svn }}
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Install selected JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin
          overwrite-settings: false

      - name: Validate source version and record SHA
        run: |
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/check-maven-release.py" "$RELEASE_VERSION" pom.xml
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'component=%s\nsource_sha=%s\nversion=%s\n' "$COMPONENT" "$(git rev-parse HEAD)" "$RELEASE_VERSION" \
            | tee "$RUNNER_TEMP/release-context.txt"

      - name: Prepare public Maven settings
        run: |
          printf '%s\n' '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"/>' > "$RUNNER_TEMP/release-settings.xml"
          chmod 600 "$RUNNER_TEMP/release-settings.xml"

      - name: Configure Maven upload credentials
        if: ${{ inputs.deploy_maven }}
        env:
          M2_SETTINGS: ${{ secrets.M2_SETTINGS }}
        run: |
          test -n "$M2_SETTINGS" || { echo 'M2_SETTINGS is required for Maven upload'; exit 1; }
          printf '%s' "$M2_SETTINGS" > "$RUNNER_TEMP/release-settings.xml"
          chmod 600 "$RUNNER_TEMP/release-settings.xml"

      - name: Check effective Maven upload target and matching server id
        if: ${{ inputs.deploy_maven }}
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" -Papache-release,stage \
            help:effective-pom -Doutput="$RUNNER_TEMP/release-effective-pom.xml"
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/check-maven-release.py" \
            "$RELEASE_VERSION" "$RUNNER_TEMP/release-effective-pom.xml" "$RUNNER_TEMP/release-settings.xml"

      - name: Import signing key for uploads
        if: ${{ inputs.deploy_maven || inputs.deploy_svn }}
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build without private credentials or signing
        if: ${{ !inputs.deploy_maven }}
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" \
            clean package -Pstage -DskipTests

      - name: Open dedicated Maven staging repository
        if: ${{ inputs.deploy_maven && inputs.make_staging_public }}
        run: |
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/maven-staging.py" \
            start "$RUNNER_TEMP/release-settings.xml"

      - name: Upload full reactor to Maven staging
        if: ${{ inputs.deploy_maven }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          deploy_options=()
          if [[ -n ${MAVEN_DEPLOY_URL:-} ]]; then
            deploy_options+=("-DaltDeploymentRepository=apache.releases.https::default::$MAVEN_DEPLOY_URL")
          fi
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" "${deploy_options[@]}" \
            clean deploy -Papache-release,stage -DskipTests -DdeployAtEnd=false

      - name: Close this Maven staging repository
        if: ${{ inputs.deploy_maven && inputs.make_staging_public }}
        run: |
          # This step runs only after the complete reactor deployment succeeds.
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/maven-staging.py" \
            close "$RUNNER_TEMP/release-settings.xml"

      - name: Upload using the source repository release script
        if: ${{ inputs.deploy_svn }}
        env:
          SVN_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          SVN_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          [[ -n $SVN_USERNAME && -n $SVN_PASSWORD ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          git branch -f "release-$RELEASE_VERSION" "$SOURCE_SHA"
          bash -e computer-dist/scripts/apache-release.sh "$RELEASE_VERSION" "$SVN_USERNAME" "$SVN_PASSWORD"

      - name: Summarize release context
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          if test -f "$RUNNER_TEMP/release-context.txt"; then
            cat "$RUNNER_TEMP/release-context.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove personal Maven settings
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/release-settings.xml" "$RUNNER_TEMP/release-effective-pom.xml"
