name: Release AI(HG)

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Source repository
        required: true
        default: 'apache/hugegraph-ai'
      repository_branch:
        description: Source branch, tag, or full commit SHA
        required: true
        default: 'release-1.5.0'
      release_version:
        required: true
        default: '1.5.0'
      deploy_svn:
        description: Upload signed source candidate to SVN dev
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-ai-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_url }}
          ref: ${{ inputs.repository_branch }}
          path: source
          persist-credentials: false

      - name: Install SVN client
        if: ${{ inputs.deploy_svn }}
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Validate source version and record SHA
        run: |
          python3 - <<'PY'
          import ast, os, re, subprocess, tomllib
          from pathlib import Path
          expected = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', expected):
              raise SystemExit('Use a numeric release version, without SNAPSHOT or RC suffix')
          # Inspect metadata without executing setup.py or installing Python packages.
          metadata = Path('pyproject.toml')
          if metadata.is_file():
              with metadata.open('rb') as f:
                  versions = [tomllib.load(f).get('project', {}).get('version')]
          else:
              tree = ast.parse(Path('hugegraph-llm/setup.py').read_text())
              versions = [keyword.value.value for node in ast.walk(tree)
                          if isinstance(node, ast.Call)
                          and ((isinstance(node.func, ast.Attribute) and node.func.attr == 'setup')
                               or (isinstance(node.func, ast.Name) and node.func.id == 'setup'))
                          for keyword in node.keywords
                          if keyword.arg == 'version' and isinstance(keyword.value, ast.Constant)]
          if versions != [expected]:
              raise SystemExit(f'Source version {versions!r} does not match {expected!r}')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SOURCE_SHA={sha}\n')
          receipt = Path(os.environ['RUNNER_TEMP']) / 'release-context.txt'
          receipt.write_text(f'component=ai\nsource_sha={sha}\nversion={expected}\npackage=source-only\n')
          print(receipt.read_text(), end='')
          PY

      - name: Check unsigned source archive
        if: ${{ !inputs.deploy_svn }}
        run: |
          archive="$RUNNER_TEMP/apache-hugegraph-ai-$RELEASE_VERSION-src.tar.gz"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git archive --format=tar.gz --output="$archive" \
            --prefix="apache-hugegraph-ai-$RELEASE_VERSION-src/" "$SOURCE_SHA"
          tar -tzf "$archive" > "$RUNNER_TEMP/source-archive-files.txt"
          test -s "$RUNNER_TEMP/source-archive-files.txt"
          sha512sum "$archive" >> "$RUNNER_TEMP/release-context.txt"

      - name: Save unsigned source prevalidation archive
        if: ${{ !inputs.deploy_svn }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-source-ai-${{ inputs.release_version }}
          path: ${{ runner.temp }}/apache-hugegraph-ai-${{ inputs.release_version }}-src.tar.gz
          if-no-files-found: error

      - name: Import signing key for SVN upload
        if: ${{ inputs.deploy_svn }}
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Upload using the source repository release script
        if: ${{ inputs.deploy_svn }}
        env:
          SVN_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          SVN_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          [[ -n $SVN_USERNAME && -n $SVN_PASSWORD ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git branch -f "release-$RELEASE_VERSION" "$SOURCE_SHA"
          # Legacy AI refs enable tracing. Copy beside the original to preserve
          # its dirname-based paths, removing only the known tracing option.
          script=scripts/apache-release-ci.sh
          trap 'rm -f "$script"' EXIT
          sed 's/^set -exo pipefail$/set -eo pipefail/' scripts/apache-release.sh > "$script"
          if grep -Eq '^set .*x' "$script"; then
            echo 'Unsupported tracing in native release script'; exit 1
          fi
          bash -e "$script" "$RELEASE_VERSION" "$SVN_USERNAME" "$SVN_PASSWORD"

      - name: Summarize release context
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          if test -f "$RUNNER_TEMP/release-context.txt"; then
            cat "$RUNNER_TEMP/release-context.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
