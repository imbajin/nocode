name: Release SVN Packages (after vote)

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        default: '1.8.0'
      svn_path:
        description: Voted candidate path under dev/hugegraph (empty uses version)
        required: false
        default: ''
      update_keys:
        required: true
        type: boolean
        description: Copy dev KEYS to release and retain dev KEYS
        default: false
      delete_pkg:
        required: false
        type: boolean
        description: Delete a previous version in release after successful migration
        default: false
      pre_version:
        required: false
        description: Previous release version to delete (must differ from this release)
        default: ''

permissions:
  contents: read

# This is an explicit post-vote entry point, never invoked by candidate uploads.
concurrency:
  group: hugegraph-svn-migration
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: publisher
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Install SVN client
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Migrate voted candidate to release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SVN_PATH: ${{ inputs.svn_path }}
          UPDATE_KEYS: ${{ inputs.update_keys }}
          DELETE_PKG: ${{ inputs.delete_pkg }}
          PRE_VERSION: ${{ inputs.pre_version }}
          SVN_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          SVN_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          bash .github/workflows/scripts/release-svn.sh \
            promote "$RELEASE_VERSION" "$SVN_PATH" "$UPDATE_KEYS" "$DELETE_PKG" "$PRE_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/release-context.txt"

      - name: Summarize migration receipt
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          if test -f "$RUNNER_TEMP/release-context.txt"; then
            cat "$RUNNER_TEMP/release-context.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save migration receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: svn-migration-context
          path: ${{ runner.temp }}/release-context.txt
          if-no-files-found: ignore
