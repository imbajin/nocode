name: Publisher CI checks

# Publisher implementation regressions only; candidate validation belongs to Doc.
on:
  pull_request:
    paths:
      - '.github/workflows/check-publisher.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/scripts/*'
      - 'tests/test_release_svn.py'
      - 'tests/test_maven_deploy.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/check-publisher.yml'
      - '.github/workflows/release*.yml'
      - '.github/workflows/scripts/*'
      - 'tests/test_release_svn.py'
      - 'tests/test_maven_deploy.py'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check release workflows and script
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/release*.yml .github/workflows/check-publisher.yml
          bash -n .github/workflows/scripts/release-svn.sh
          shellcheck .github/workflows/scripts/release-svn.sh
          python3 -m py_compile .github/workflows/scripts/check-maven-release.py
      - name: Test local Maven deployment and SVN migration
        run: python3 -m unittest discover -s tests -v
