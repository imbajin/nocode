name: Inspect HugeGraph Nexus metadata (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect profiles and current candidates without writes
        env:
          M2_SETTINGS: ${{ secrets.M2_SETTINGS }}
        run: |
          python3 - <<'PYCODE'
          import importlib.util, os
          from pathlib import Path
          settings = Path(os.environ['RUNNER_TEMP']) / 'settings.xml'
          settings.touch(mode=0o600)
          try:
              settings.write_text(os.environ['M2_SETTINGS'])
              spec = importlib.util.spec_from_file_location('staging', '.github/workflows/scripts/maven-staging.py')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              nexus = module.Nexus(settings)
              profiles = nexus.request('/staging/profiles')
              print('HugeGraph profiles:', [{key: row.get(key) for key in ('id', 'name')} for row in profiles if 'hugegraph' in row.get('name', '').lower()])
              for identifier in ('orgapachehugegraph-1160', 'orgapachehugegraph-1161'):
                  metadata = nexus.request('/staging/repository/' + identifier)
                  print({key: metadata.get(key) for key in ('repositoryId', 'profileId', 'profileName', 'type', 'transitioning')})
          finally:
              settings.unlink(missing_ok=True)
          PYCODE
