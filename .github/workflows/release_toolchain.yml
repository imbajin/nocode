name: Release Toolchain(HG)

on:
  workflow_dispatch:
    inputs:
      repository_url:
        required: true
        default: 'apache/hugegraph-toolchain'
      repository_branch:
        description: Source branch, tag, or full commit SHA
        required: true
        default: 'master'
      release_version:
        required: true
        default: '1.8.0'
      deploy_maven:
        description: Upload to Apache Maven staging (never promote)
        required: true
        type: boolean
        default: false
      deploy_svn:
        description: Upload signed candidate to SVN dev
        required: true
        type: boolean
        default: false
      svn_path:
        description: Candidate path under SVN dev/hugegraph (empty uses version)
        required: false
        default: ''
      staging_repository:
        description: Specific Apache Maven staging repository containing SDK 1.8.0 (empty uses public staging group)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-toolchain-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      SVN_PATH: ${{ inputs.svn_path }}
      COMPONENT: toolchain
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_url }}
          ref: ${{ inputs.repository_branch }}
          path: source
          persist-credentials: false

      - name: Install SVN client
        if: ${{ inputs.deploy_svn }}
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          overwrite-settings: false

      - name: Validate source version and record SHA
        run: |
          python3 - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', expected):
              raise SystemExit('Use a numeric release version, without SNAPSHOT or RC suffix')
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          pom = ET.parse('pom.xml').getroot()
          version = pom.findtext('m:version', namespaces=ns)
          if version == '${revision}':
              version = pom.findtext('m:properties/m:revision', namespaces=ns)
          if version != expected:
              raise SystemExit(f'Source version {version!r} does not match {expected!r}')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SOURCE_SHA={sha}\n')
          receipt = Path(os.environ['RUNNER_TEMP']) / 'release-context.txt'
          receipt.write_text(f'component={os.environ["COMPONENT"]}\nsource_sha={sha}\nversion={version}\n')
          print(receipt.read_text(), end='')

          if pom.findtext('m:properties/m:hugegraph.version', namespaces=ns) != '1.8.0':
              raise SystemExit('Toolchain must compile against SDK 1.8.0')
          dist = ET.parse('hugegraph-dist/pom.xml').getroot()
          if dist.findtext('m:artifactId', namespaces=ns) != 'hugegraph-toolchain-dist':
              raise SystemExit('Toolchain dist artifactId must be hugegraph-toolchain-dist')
          PY

      - name: Prepare public Maven settings
        run: |
          printf '%s\n' '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"/>' > "$RUNNER_TEMP/release-settings.xml"
          chmod 600 "$RUNNER_TEMP/release-settings.xml"

      - name: Configure Maven upload credentials
        if: ${{ inputs.deploy_maven }}
        env:
          M2_SETTINGS: ${{ secrets.M2_SETTINGS }}
        run: |
          test -n "$M2_SETTINGS" || { echo 'M2_SETTINGS is required for Maven upload'; exit 1; }
          printf '%s' "$M2_SETTINGS" > "$RUNNER_TEMP/release-settings.xml"
          chmod 600 "$RUNNER_TEMP/release-settings.xml"

      # Hubble's frontend-maven-plugin installs the source-pinned Node and Yarn.
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('source/**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Configure explicit SDK staging consumption
        if: ${{ inputs.staging_repository != '' }}
        env:
          STAGING_REPOSITORY: ${{ inputs.staging_repository }}
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          url = os.environ['STAGING_REPOSITORY'].rstrip('/')
          if not re.fullmatch(r'https://repository\.apache\.org/content/repositories/orgapachehugegraph-[0-9]+', url):
              raise SystemExit('Specify an individual Apache HugeGraph staging repository, not the staging group')
          path = Path(os.environ['RUNNER_TEMP']) / 'release-settings.xml'
          tree = ET.parse(path)
          root = tree.getroot()
          namespace = root.tag.split('}')[0][1:] if root.tag.startswith('{') else ''
          def tag(name):
              return f'{{{namespace}}}{name}' if namespace else name
          def child(parent, name):
              found = parent.find(tag(name))
              return found if found is not None else ET.SubElement(parent, tag(name))
          # Override only the POM's staging group, leaving Central available for other libraries.
          mirrors = child(root, 'mirrors')
          for mirror in list(mirrors):
              if mirror.findtext(tag('mirrorOf')) in ('*', 'external:*', 'external:http:*'):
                  raise SystemExit('A catch-all settings mirror would obscure the chosen SDK repository')
          mirror = ET.SubElement(mirrors, tag('mirror'))
          for key, value in [('id', 'candidate-sdk'), ('mirrorOf', 'staged-releases'), ('url', url)]:
              ET.SubElement(mirror, tag(key)).text = value
          profiles = child(root, 'profiles')
          profile = ET.SubElement(profiles, tag('profile'))
          ET.SubElement(profile, tag('id')).text = 'candidate-sdk'
          repositories = ET.SubElement(profile, tag('repositories'))
          repository = ET.SubElement(repositories, tag('repository'))
          ET.SubElement(repository, tag('id')).text = 'candidate-sdk'
          ET.SubElement(repository, tag('url')).text = url
          releases = ET.SubElement(repository, tag('releases'))
          ET.SubElement(releases, tag('enabled')).text = 'true'
          ET.SubElement(releases, tag('updatePolicy')).text = 'always'
          snapshots = ET.SubElement(repository, tag('snapshots'))
          ET.SubElement(snapshots, tag('enabled')).text = 'false'
          ET.SubElement(child(root, 'activeProfiles'), tag('activeProfile')).text = 'candidate-sdk'
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print(f'SDK staging repository: {url}')
          with open(Path(os.environ['RUNNER_TEMP']) / 'release-context.txt', 'a') as f:
              f.write(f'sdk_staging_repository={url}\n')
          PY

      - name: Resolve and prove SDK from the chosen staging repository
        if: ${{ inputs.staging_repository != '' }}
        run: |
          # Fresh repository: installed same-version artifacts cannot mask a missing SDK.
          for artifact in hugegraph-common hugegraph-core hugegraph-server hg-pd-client hg-pd-common hg-pd-grpc hg-store-common; do
            mvn -N -B -ntp -U -s "$RUNNER_TEMP/release-settings.xml" \
              -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" -Pstage \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              "-Dartifact=org.apache.hugegraph:$artifact:1.8.0" -Dtransitive=false
            marker="$RUNNER_TEMP/maven-repository/org/apache/hugegraph/$artifact/1.8.0/_remote.repositories"
            for extension in jar pom; do
              grep -Fx "$artifact-1.8.0.$extension>candidate-sdk=" "$marker" > /dev/null || {
                echo "SDK $artifact $extension was not downloaded from the requested staging repository"; exit 1;
              }
              sha512sum "$RUNNER_TEMP/maven-repository/org/apache/hugegraph/$artifact/1.8.0/$artifact-1.8.0.$extension" \
                >> "$RUNNER_TEMP/release-context.txt"
            done
          done

      - name: Check effective Maven upload target and matching server id
        if: ${{ inputs.deploy_maven }}
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" -Papache-release,stage \
            help:effective-pom -Doutput="$RUNNER_TEMP/release-effective-pom.xml"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          model = ET.parse(temp / 'release-effective-pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          settings = ET.parse(temp / 'release-settings.xml').getroot()
          # Support namespaced and legacy unnamespaced personal settings without showing values.
          server_ids = {element.text for server in settings.iter()
                        if server.tag.split('}')[-1] == 'server'
                        for element in server if element.tag.split('}')[-1] == 'id'}
          projects = [model] if model.tag.split('}')[-1] == 'project' else model.findall('m:project', ns)
          if not projects:
              raise SystemExit('Effective POM contains no projects')
          lines = []
          for project in projects:
              version = project.findtext('m:version', namespaces=ns)
              artifact = project.findtext('m:artifactId', namespaces=ns)
              if version != os.environ['RELEASE_VERSION']:
                  raise SystemExit(f'Effective version mismatch for {artifact}: {version}')
              repository = project.find('m:distributionManagement/m:repository', ns)
              if repository is None:
                  raise SystemExit(f'Missing release deploy repository for {artifact}')
              repository_id = repository.findtext('m:id', namespaces=ns)
              url = repository.findtext('m:url', namespaces=ns)
              if repository_id != 'apache.releases.https' or url != 'https://repository.apache.org/service/local/staging/deploy/maven2':
                  raise SystemExit(f'Unsupported upload target for {artifact}: {repository_id} {url}')
              if repository_id not in server_ids:
                  raise SystemExit(f'M2_SETTINGS lacks server id {repository_id}')
              for plugin in project.findall('m:build/m:plugins/m:plugin', ns):
                  if plugin.findtext('m:artifactId', namespaces=ns) == 'nexus-staging-maven-plugin':
                      raise SystemExit('Use plain staging deploy; Nexus close/promote is not allowed')
              lines.append(f'maven_module={artifact}:{version} target={url} server_id={repository_id}')
          with open(temp / 'release-context.txt', 'a') as f:
              f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Import signing key for uploads
        if: ${{ inputs.deploy_maven || inputs.deploy_svn }}
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build without private credentials or signing
        if: ${{ !inputs.deploy_maven }}
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" \
            clean package -Pstage -DskipTests

      - name: Upload full reactor to Maven staging
        if: ${{ inputs.deploy_maven }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" \
            clean deploy -Papache-release,stage -DskipTests -DdeployAtEnd=true

      - name: Save built binary distribution
        uses: actions/upload-artifact@v4
        with:
          name: binary-hugegraph-toolchain-${{ inputs.release_version }}
          path: source/target/apache-hugegraph-toolchain-${{ inputs.release_version }}.tar.gz
          if-no-files-found: error

      - name: Prepare signed SVN candidate
        if: ${{ inputs.deploy_svn }}
        env:
          GPG_KEY_ID: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/release-svn.sh" \
            prepare "$COMPONENT" "$RELEASE_VERSION" "$SVN_PATH" \
            "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/svn-candidate" \
            2>&1 | tee -a "$RUNNER_TEMP/release-context.txt"

      - name: Upload candidate to SVN dev
        if: ${{ inputs.deploy_svn }}
        env:
          GPG_KEY_ID: ${{ steps.import_gpg.outputs.fingerprint }}
          SVN_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          SVN_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          bash "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/release-svn.sh" \
            upload "$RELEASE_VERSION" "$SVN_PATH" "$RUNNER_TEMP/svn-candidate" \
            2>&1 | tee -a "$RUNNER_TEMP/release-context.txt"

      - name: Save signed SVN candidate
        if: ${{ always() && inputs.deploy_svn }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-svn-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/svn-candidate/
          if-no-files-found: ignore

      - name: Summarize release context
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          if test -f "$RUNNER_TEMP/release-context.txt"; then
            cat "$RUNNER_TEMP/release-context.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save release context
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-context-${{ env.COMPONENT }}
          path: ${{ runner.temp }}/release-context.txt
          if-no-files-found: ignore

      - name: Remove personal Maven settings
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/release-settings.xml" "$RUNNER_TEMP/release-effective-pom.xml"
