name: Release Toolchain(HG)

on:
  workflow_dispatch:
    inputs:
      repository_url:
        required: true
        default: 'apache/hugegraph-toolchain'
      repository_branch:
        description: Source branch, tag, or full commit SHA
        required: true
        default: 'release-1.8.0'
      release_version:
        required: true
        default: '1.8.0'
      deploy_maven:
        description: Upload to Apache Maven staging (never promote)
        required: true
        type: boolean
        default: false
      deploy_svn:
        description: Upload signed candidate to SVN dev
        required: true
        type: boolean
        default: false
      staging_repository:
        description: Specific Apache Maven staging repository containing SDK 1.8.0 (empty uses public staging group)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-toolchain-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      COMPONENT: toolchain
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_url }}
          ref: ${{ inputs.repository_branch }}
          path: source
          persist-credentials: false

      - name: Install SVN client
        if: ${{ inputs.deploy_svn }}
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          overwrite-settings: false

      - name: Validate source version and record SHA
        run: |
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/check-maven-release.py" "$RELEASE_VERSION" pom.xml
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'component=%s\nsource_sha=%s\nversion=%s\n' "$COMPONENT" "$(git rev-parse HEAD)" "$RELEASE_VERSION" \
            | tee "$RUNNER_TEMP/release-context.txt"

      - name: Prepare public Maven settings
        run: |
          printf '%s\n' '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"/>' > "$RUNNER_TEMP/release-settings.xml"
          chmod 600 "$RUNNER_TEMP/release-settings.xml"

      - name: Configure Maven upload credentials
        if: ${{ inputs.deploy_maven }}
        env:
          M2_SETTINGS: ${{ secrets.M2_SETTINGS }}
        run: |
          test -n "$M2_SETTINGS" || { echo 'M2_SETTINGS is required for Maven upload'; exit 1; }
          printf '%s' "$M2_SETTINGS" > "$RUNNER_TEMP/release-settings.xml"
          chmod 600 "$RUNNER_TEMP/release-settings.xml"

      # Hubble's frontend-maven-plugin installs the source-pinned Node and Yarn.
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('source/**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Select SDK staging repository
        if: ${{ inputs.staging_repository != '' }}
        env:
          STAGING_REPOSITORY: ${{ inputs.staging_repository }}
        run: |
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/configure-sdk-staging.py"

      - name: Resolve SDK from the selected staging repository
        if: ${{ inputs.staging_repository != '' }}
        env:
          STAGING_REPOSITORY: ${{ inputs.staging_repository }}
        run: |
          # The isolated local repository prevents installed SDKs masking missing staged artifacts.
          for artifact in hugegraph-common hugegraph-core hg-pd-client hg-pd-common hg-pd-grpc; do
            # The POM controls transitive dependencies; verify it separately from the JAR.
            for type in jar pom; do
              mvn -N -B -ntp -U -s "$RUNNER_TEMP/release-settings.xml" \
                -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" -Pstage \
                org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
                "-Dartifact=org.apache.hugegraph:$artifact:1.8.0:$type" -Dtransitive=false
              grep -Fx -e "$artifact-1.8.0.$type>apache.releases.https=" \
                -e "$artifact-1.8.0.$type>$SDK_REPOSITORY_KEY=" \
                "$RUNNER_TEMP/maven-repository/org/apache/hugegraph/$artifact/1.8.0/_remote.repositories" > /dev/null || {
                echo "SDK $artifact $type did not come from the selected staging repository"; exit 1;
              }
            done
          done

      - name: Check effective Maven upload target and matching server id
        if: ${{ inputs.deploy_maven }}
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" -Papache-release,stage \
            help:effective-pom -Doutput="$RUNNER_TEMP/release-effective-pom.xml"
          python3 "$GITHUB_WORKSPACE/publisher/.github/workflows/scripts/check-maven-release.py" \
            "$RELEASE_VERSION" "$RUNNER_TEMP/release-effective-pom.xml" "$RUNNER_TEMP/release-settings.xml"

      - name: Import signing key for uploads
        if: ${{ inputs.deploy_maven || inputs.deploy_svn }}
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build without private credentials or signing
        if: ${{ !inputs.deploy_maven }}
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" \
            clean package -Pstage -DskipTests

      - name: Upload full reactor to Maven staging
        if: ${{ inputs.deploy_maven }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mvn -B -ntp -s "$RUNNER_TEMP/release-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-repository" \
            clean deploy -Papache-release,stage -DskipTests -DdeployAtEnd=false

      - name: Save built binary distribution
        uses: actions/upload-artifact@v4
        with:
          name: binary-hugegraph-toolchain-${{ inputs.release_version }}
          path: source/target/apache-hugegraph-toolchain-${{ inputs.release_version }}.tar.gz
          if-no-files-found: error

      - name: Upload using the source repository release script
        if: ${{ inputs.deploy_svn }}
        env:
          SVN_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          SVN_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          [[ -n $SVN_USERNAME && -n $SVN_PASSWORD ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          git branch -f "release-$RELEASE_VERSION" "$SOURCE_SHA"
          bash -e hugegraph-dist/scripts/apache-release.sh "$RELEASE_VERSION" "$SVN_USERNAME" "$SVN_PASSWORD"

      - name: Summarize release context
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: |
          if test -f "$RUNNER_TEMP/release-context.txt"; then
            cat "$RUNNER_TEMP/release-context.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove personal Maven settings
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/release-settings.xml" "$RUNNER_TEMP/release-effective-pom.xml"
